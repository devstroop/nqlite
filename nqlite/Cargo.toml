[package]
name = "nqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "nqlite engine — deterministic, zero-LLM storage + indexes + execution of nql Plans."
keywords = ["nql", "database", "sql", "storage", "engine"]
categories = ["database", "database-implementations"]

[features]
default = []
# Opt-in approximate vector index (HNSW). NOT the default: exact brute-force
# (BruteForceVectorIndex) remains the deterministic engine default.
hnsw = ["dep:fast-hnsw"]

[dependencies]
nql = { path = "../nql" }
nql-ir = { path = "../nql-ir" }
serde.workspace = true
thiserror.workspace = true
# Deterministic binary serialization for the single-file store (M1).
postcard = { version = "1", features = ["alloc"] }
# CRC-32 frame checksums for the write-ahead log.
crc32fast = "1"
# Pure-Rust HNSW, only compiled with the `hnsw` feature (see src/index.rs).
fast-hnsw = { version = "1.0.1", optional = true }

[dev-dependencies]
# Benchmark harness (see benches/). Benches are gated by the same CI checks as
# the rest of the workspace (`cargo clippy --workspace --all-targets`).
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
# Criterion provides its own runner via criterion_main!; the default libtest
# bench harness would conflict.
harness = false