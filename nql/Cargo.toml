[package]
name = "nql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "nql neural query language — deterministic, zero-LLM parser + AST front-end (storage-agnostic)."
keywords = ["nql", "sql", "parser", "ast", "query-language"]
categories = ["parser-implementations", "database"]

[dependencies]
nql-ir = { path = "../nql-ir" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
# Golden corpus export for the nqlite-zig M2 parser gate (spec/fixtures/nql):
# hex = postcard(Statement), the same bytes the format-v4 codec emits.
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"