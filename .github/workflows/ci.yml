name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  determinism-stable:
    name: determinism (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  determinism-msrv:
    name: determinism (pinned dev-tree MSRV)
    runs-on: ubuntu-latest
    env:
      # Dev-tree MSRV pin: the lowest rustc that can build the whole workspace
      # against a FRESH dependency resolution (Cargo.lock is not committed).
      # Bump when `cargo check` reports a transitive dep needs more — the
      # error names the exact version required (e.g. rmcp 3.1.1 -> 1.88,
      # uuid 1.27.0 via rmcp -> 1.89). Consumer-facing MSRV (rust-version
      # 1.82) stays lower: library users never build rmcp.
      MSRV_PIN: "1.89.0"
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on runners; the dtolnay composite action's
      # step env fails for pinned versions on the current runner, so
      # install directly and invoke via `cargo +<toolchain>`.
      - name: install pinned toolchain
        run: rustup toolchain install "$MSRV_PIN" --profile minimal
      - name: check-shipped-artifacts
        run: cargo +"$MSRV_PIN" check --workspace --lib --bins
