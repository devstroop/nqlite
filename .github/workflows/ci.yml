name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  determinism:
    name: determinism (stable + MSRV)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned MSRV = rust-version 1.82. Identical test results on both
        # toolchains prove byte-determinism across compiler versions (issue #71).
        toolchain: [stable, 1.82.0]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
