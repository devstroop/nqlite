name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  determinism-stable:
    name: determinism (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  determinism-msrv:
    name: determinism (pinned dev-tree MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on runners; the dtolnay composite action's
      # step env fails to apply for pinned versions on the current runner,
      # so install directly and invoke via `cargo +<toolchain>`.
      - name: install pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: check-shipped-artifacts
        run: cargo +1.85.0 check --workspace --lib --bins
