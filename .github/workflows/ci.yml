name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  determinism:
    name: determinism (stable + MSRV)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned MSRV = rust-version 1.82. The stable leg runs the full
        # suite; the MSRV leg proves the shipped artifacts compile on the
        # declared minimum (cargo check --lib --bins — no dev-deps).
        toolchain: [stable, 1.82.0]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: msrv-check
        if: matrix.toolchain != 'stable'
        run: cargo check --workspace --lib --bins
