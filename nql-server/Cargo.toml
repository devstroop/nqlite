[package]
name = "nql-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic, zero-LLM line-protocol nql server (TCP + stdio) for nqlite."
keywords = ["server", "tcp", "sql", "nqlite", "line-protocol"]
categories = ["network-programming", "database"]

[[bin]]
name = "nql-server"
path = "src/main.rs"

[dependencies]
nql = { path = "../nql" }
nql-ir = { path = "../nql-ir" }
nqlite = { path = "../nqlite" }